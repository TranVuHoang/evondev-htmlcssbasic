<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#8. BEM trong HTML</title>
  </head>
  <body>
    <!--
    BEM: Block Element Modifier
    Là phương pháp đặt tên class
    -->

    <!--
    Laptop: Block
    Keyboard, mouse, touchpad, screen: Element
    Laptop big, laptop small: Modifier for block
    Small keyboard, small screen: Modifier for Element

    Block__Element--modifier
    Block__Element
    Block--modifier

    Example:
    laptop__keyboard, laptop__mouse, laptop__touchpad
    laptop--small, laptop--big
    laptop__touchpad--smooth, laptop__screen--scale
    -->
  </body>
</html>
