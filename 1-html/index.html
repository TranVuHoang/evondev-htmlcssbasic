<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS</title>
  </head>
  <body>
    <!--
    - Thẻ inline có độ rộng bằng nội dung mà nó chứa
    - Nếu có nhiều thẻ inline cùng nhau thì chúng vẫn nằm trên 1 hàng
    - Bị hạn chế về thuộc tính CSS
    -->
    <span>Demo</span>
    <span>Demo</span>
    <span>Demo</span>
    <span>Demo</span>

    <!--
      - Thẻ block có độn rộng full phần tử chứa nó
      - Mỗi thẻ block chỉ nằm trên 1 hàng
    -->
    <p>Demo</p>
    <p>Demo</p>
    <p>Demo</p>

    <p>Nếu bạn muốn đọc thêm thì các bạn nhấn <a href="#">tại đây</a></p>
  </body>
</html>
