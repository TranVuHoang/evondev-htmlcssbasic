<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS</title>
  </head>
  <body>
    <!--
    Tạo thẻ div có class demo:
    .demo + tab: => <div class="demo"></div>
    -->
    <div class="demo"></div>

    <!-- #demo + tab -->
    <div id="demo"></div>

    <!-- .demo1.demo2.demo3 + tab -->
    <div class="demo1 demo2 demo3"></div>

    <!-- copy dòng: shift + alt + mũi tên xuống -->
    <!-- copy dòng: shift + alt + mũi tên xuống -->

    <!-- ul>li*5 + tab -->
    <ul>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <!-- h$*6 +tab  -->
    <h1></h1>
    <h2></h2>
    <h3></h3>
    <h4></h4>
    <h5></h5>
    <h6></h6>

    <!-- h$*6{heading $} +tab -->
    <h1>heading 1</h1>
    <h2>heading 2</h2>
    <h3>heading 3</h3>
    <h4>heading 4</h4>
    <h5>heading 5</h5>
    <h6>heading 6</h6>
    ...
  </body>
</html>
